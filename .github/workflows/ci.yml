name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      # esptool.py (invoked by the ESP32 core during compile) imports pyserial.
      - name: Install esptool host dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-serial

      - name: Cache Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-esp32-2.0.17-${{ hashFiles('src/esp32_room_sensors/sketch.yaml') }}
          restore-keys: |
            arduino-${{ runner.os }}-esp32-2.0.17-

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls "$ESP32_INDEX_URL"

      - name: Install pinned libraries
        run: |
          arduino-cli lib install "Adafruit BME280 Library@2.3.0"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "RTClib@2.1.4"
          arduino-cli lib install "TinyMPU6050@0.5.3"

      - name: Provide wifi_pass.h
        run: cp src/esp32_room_sensors/wifi_pass.example.h src/esp32_room_sensors/wifi_pass.h

      - name: Compile
        run: arduino-cli compile --profile esp32 src/esp32_room_sensors

  guards:
    name: Repo guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ignored files must not be tracked
        run: |
          tracked="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked" ]; then
            echo "::error::files are tracked but ignored by .gitignore:"
            echo "$tracked"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install codespell
        run: pip install codespell==2.3.0

      - name: codespell
        run: codespell
